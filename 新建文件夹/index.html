<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a140e">
<title>郭玉娴 · 听力语言与康复学 · 个人简历</title>
<style>
:root {
  /* 夜空 · 静谧温暖高端 */
  --bg: #0a140e;
  --surface: rgba(255,255,255,0.055);
  --surface-2: rgba(255,255,255,0.10);
  --text: #eef4e9;
  --text-soft: #aebfa9;
  --primary: #9bd0a8;
  --primary-light: #c3e6cb;
  --accent: #d9b87a;          /* 暖金 */
  --border: rgba(255,255,255,0.12);
  --shadow: 0 10px 30px rgba(0,0,0,0.35);
  --shadow-hover: 0 22px 48px rgba(0,0,0,0.55);
  --radius: 22px;
  --radius-sm: 16px;
  --transition: 200ms cubic-bezier(0.2, 0, 0, 1);
  --maxw: 1080px;
  --font-sys: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
}
/* 黎明 · 浅色模式（温和暖调） */
[data-theme="light"] {
  --bg: #eef5ea;
  --surface: rgba(255,255,255,0.72);
  --surface-2: rgba(234,243,230,0.85);
  --text: #19261c;
  --text-soft: #4a5f4e;
  --primary: #2f5d3a;
  --primary-light: #6f9e7c;
  --accent: #b8924f;
  --border: rgba(47,93,58,0.16);
  --shadow: 0 10px 25px rgba(28,52,32,0.08);
  --shadow-hover: 0 22px 44px rgba(28,52,32,0.16);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 86px; }
body {
  font-family: var(--font-sys);
  background:
    radial-gradient(ellipse at 50% -10%, #16291d 0%, #0a140e 55%, #060d09 100%) fixed;
  color: var(--text);
  transition: background var(--transition), color var(--transition);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding: 0 16px 70px;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}
[data-theme="light"] body {
  background:
    radial-gradient(ellipse at 50% -10%, #f6faf2 0%, #eef5ea 60%, #e3eee0 100%) fixed;
}
/* 星空画布 */
#starfield {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(circle at 12% 14%, rgba(217,184,122,0.10) 0, transparent 32%),
    radial-gradient(circle at 88% 8%, rgba(155,208,168,0.12) 0, transparent 26%);
}
.container { max-width: var(--maxw); margin: 0 auto; position: relative; z-index: 1; }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  backdrop-filter: blur(16px);
  background: color-mix(in srgb, var(--bg) 60%, transparent);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
  transition: background var(--transition);
}
.nav-inner { max-width: var(--maxw); margin: 0 auto; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.brand-area { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 1.5rem; letter-spacing: 0.5px; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-motto { font-size: 0.85rem; color: var(--text-soft); font-style: italic; letter-spacing: 0.8px; }
.nav-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  background: var(--surface); border: 1px solid var(--border); color: var(--text-soft);
  border-radius: 30px; padding: 8px 12px; font-size: 0.85rem; cursor: pointer;
  transition: all var(--transition); display: inline-flex; align-items: center; gap: 4px;
  white-space: nowrap; min-width: 44px; min-height: 44px; justify-content: center;
}
.icon-btn:hover { background: var(--surface-2); color: var(--primary); border-color: var(--primary-light); }
.nav-links { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; width: 100%; order: 3; }
.nav-links::-webkit-scrollbar { display: none; }
.nav-links a { text-decoration: none; color: var(--text-soft); font-weight: 500; font-size: 0.9rem; padding: 8px 10px; border-radius: 30px; white-space: nowrap; transition: all var(--transition); }
.nav-links a:hover { color: var(--primary); background: var(--surface-2); }

.hero { padding: 110px 6px 30px; text-align: center; animation: fadeUp 0.5s ease both; }
.avatar-frame {
  width: 118px; height: 118px; border-radius: 50%; margin: 0 auto 15px;
  position: relative; overflow: hidden;
  background-image: linear-gradient(135deg, var(--accent), var(--primary));
  border: 2px solid rgba(255,255,255,0.25);
  box-shadow: 0 0 0 6px rgba(155,208,168,0.12), var(--shadow);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.avatar-frame:hover { box-shadow: 0 0 0 8px rgba(217,184,122,0.22), var(--shadow-hover); }
.avatar-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.avatar-img.hidden { display: none; }
.avatar-fallback { font-size: 0.8rem; color: #0a140e; letter-spacing: 1px; font-weight: 600; }

.hero-name-wrap { position: relative; display: inline-block; padding: 14px 34px; }
.name-glow {
  position: absolute; inset: -40% -12%; z-index: -1; border-radius: 50%;
  background: radial-gradient(circle, rgba(217,184,122,0.40) 0%, rgba(155,208,168,0.18) 42%, transparent 70%);
  filter: blur(22px); animation: glowPulse 4.5s ease-in-out infinite;
}
@keyframes glowPulse { 0%,100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.10); } }
.spark { position: absolute; color: var(--accent); text-shadow: 0 0 10px rgba(217,184,122,0.9); animation: twinkle 2.6s ease-in-out infinite; }
.spark.s1 { top: 2px; left: 4%; font-size: 1rem; }
.spark.s2 { top: 46%; right: 0%; font-size: 0.8rem; animation-delay: 0.9s; }
.spark.s3 { bottom: 2px; left: 16%; font-size: 0.7rem; animation-delay: 1.7s; }
@keyframes twinkle { 0%,100% { opacity: 0.15; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.25); } }

.hero h1 { font-size: 2.8rem; font-weight: 700; letter-spacing: -0.5px; background: linear-gradient(140deg, #fff 20%, var(--accent) 65%, var(--primary)); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 6px; }

/* 信条 · 逐字流星（循环飞入，端正落定） */
.hero-motto {
  font-size: 1.3rem; font-weight: 500; color: var(--primary-light);
  letter-spacing: 2px; font-style: italic; margin-bottom: 18px;
  min-height: 1.6em;
}
.meteor-chars { display: inline-flex; gap: 0.22em; }
.meteor-chars .ch {
  position: relative; display: inline-block; opacity: 0;
  text-shadow: 0 0 18px rgba(217,184,122,0.7);
  will-change: transform, opacity;
}
.meteor-chars .ch.fly { animation: chMeteor 0.9s cubic-bezier(0.18, 0.7, 0.2, 1) forwards; }
.meteor-chars .ch.out { animation: chOut 0.8s ease forwards; }
.meteor-chars .ch::after {
  content: ""; position: absolute; right: 100%; top: 54%;
  width: 80px; height: 3px; border-radius: 3px;
  background: linear-gradient(90deg, rgba(217,184,122,0) 0%, rgba(255,236,194,0.95) 70%, #fff 100%);
  filter: blur(1.2px);
  transform-origin: 100% 50%;
  transform: translateY(-50%) rotate(-30deg);
  opacity: 0; pointer-events: none;
}
.meteor-chars .ch.fly::after { animation: chTail 0.9s cubic-bezier(0.18, 0.7, 0.2, 1) forwards; }
@keyframes chMeteor {
  0%   { transform: translate(-38px, -22px) scale(0.96); opacity: 0; }
  18%  { opacity: 1; }
  68%  { transform: translate(6px, 4px) scale(1); opacity: 1; }
  84%  { transform: translate(-2px, -1px) scale(1); opacity: 1; }
  100% { transform: translate(0, 0) scale(1); opacity: 1; }
}
@keyframes chTail {
  0%   { opacity: 0; width: 0; }
  18%  { opacity: 1; width: 22px; }
  68%  { opacity: 0.85; width: 56px; }
  100% { opacity: 0; width: 56px; }
}
@keyframes chOut {
  from { opacity: 1; transform: translate(0, 0); }
  to   { opacity: 0; transform: translate(0, -12px) scale(0.96); }
}

.hero-education { color: var(--text-soft); font-size: 0.95rem; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
.hero-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

.btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 12px 22px; border-radius: 40px; font-weight: 500; font-size: 0.9rem; text-decoration: none; cursor: pointer; transition: all var(--transition); box-shadow: var(--shadow); display: inline-flex; align-items: center; gap: 6px; min-height: 48px; backdrop-filter: blur(6px); }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)); border-color: transparent; color: #07120b; }
.btn-primary:hover { box-shadow: 0 0 24px rgba(155,208,168,0.45); }
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

.section-title { font-size: 1.8rem; font-weight: 650; margin: 44px 0 20px; display: flex; align-items: center; gap: 12px; letter-spacing: -0.2px; }
.section-title::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, var(--primary-light), transparent); border-radius: 2px; }
.section-sub { color: var(--text-soft); font-size: 0.92rem; margin: -10px 0 16px; text-align: center; }

/* ---------- 分身 · 立体星球（无卡片框，悬浮星空） ---------- */
.planet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 38px 14px; margin: 26px 0 12px; }
.planet-item {
  position: relative; display: flex; flex-direction: column; align-items: center; text-align: center;
  text-decoration: none; color: var(--text); cursor: pointer; padding: 8px 4px 14px;
  transition: transform var(--transition);
}
.planet-item:hover { transform: translateY(-6px); }
.planet-item h3 { font-size: 1.02rem; font-weight: 600; color: var(--primary-light); margin-bottom: 5px; text-shadow: 0 2px 12px rgba(0,0,0,0.45); }
.planet-item p { font-size: 0.8rem; color: var(--text-soft); line-height: 1.4; }
.planet-item .badge { margin-top: 8px; }
.planet-item.is-locked { cursor: default; opacity: 0.72; }
.planet-item.is-locked:hover { transform: none; }

/* 进入提示 · 指向星球的箭头 */
.hint-arrow {
  margin-top: 10px; width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--accent);
  animation: arrowBob 1.8s ease-in-out infinite;
}
.planet-item:hover .hint-arrow { background: color-mix(in srgb, var(--accent) 26%, transparent); }
@keyframes arrowBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.hint-lock { margin-top: 10px; font-size: 0.74rem; color: var(--text-soft); opacity: 0.75; display: flex; align-items: center; gap: 5px; letter-spacing: 0.5px; }

.planet-stage { position: relative; width: 150px; height: 150px; margin-bottom: 16px; transition: transform var(--transition); }
.planet-item:not(.is-locked):hover .planet-stage { transform: scale(1.07); }
.planet-item:not(.is-locked):hover .sphere { filter: brightness(1.12) saturate(1.08); }

.sphere {
  position: absolute; inset: 0; z-index: 1; border-radius: 50%; overflow: hidden;
  transition: filter var(--transition);
}
.surface {
  position: absolute; top: 0; left: 0; width: 200%; height: 100%;
  background-repeat: repeat-x; background-size: 50% 100%;
  animation: surfSpin var(--spin, 30s) linear infinite;
}
@keyframes surfSpin { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.shade {
  position: absolute; inset: 0; border-radius: 50%;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,0.34), rgba(255,255,255,0) 42%),
    radial-gradient(circle at 74% 82%, rgba(0,0,0,0.52), rgba(0,0,0,0) 64%);
  box-shadow: inset -24px -20px 52px rgba(0,0,0,0.6), inset 10px 10px 28px rgba(255,255,255,0.14);
}

/* 心理学 · 珊瑚气态巨行星 + 光环 + 心形卫星 */
.pl-psy .sphere { background: #e08a72; box-shadow: 0 0 38px rgba(247,167,141,0.5), 0 0 90px rgba(247,167,141,0.18); }
.pl-psy .surface {
  --spin: 26s;
  background-image:
    radial-gradient(ellipse 24% 13% at 16% 30%, rgba(255,238,224,0.55), transparent 72%),
    radial-gradient(ellipse 30% 16% at 52% 64%, rgba(146,52,38,0.4), transparent 74%),
    radial-gradient(ellipse 17% 9% at 76% 24%, rgba(255,208,188,0.5), transparent 72%),
    radial-gradient(ellipse 26% 14% at 92% 78%, rgba(128,40,30,0.34), transparent 74%),
    linear-gradient(180deg,
      rgba(255,224,206,0.26) 0 16%, transparent 16% 34%,
      rgba(150,62,46,0.24) 34% 52%, transparent 52% 70%,
      rgba(255,216,198,0.18) 70% 86%, transparent 86%);
}
.pl-psy .aura { position: absolute; inset: -13px; border-radius: 50%; border: 1px solid rgba(255,180,160,0.26); z-index: 2; pointer-events: none; }
.pl-psy .aura::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; border: 1px solid rgba(255,180,160,0.16); }
.sat-orbit { position: absolute; inset: -16px; border-radius: 50%; z-index: 3; animation: heartOrbit 12s linear infinite; pointer-events: none; }
.sat-orbit .heart { position: absolute; top: -3px; left: 50%; transform: translateX(-50%); font-size: 0.95rem; color: #ffe1d6; text-shadow: 0 0 10px rgba(255,170,150,0.95); }
@keyframes heartOrbit {
  from { transform: rotate(-12deg) rotate(0turn); opacity: 0.55; }
  50%  { opacity: 1; }
  to   { transform: rotate(-12deg) rotate(1turn); opacity: 0.55; }
}

/* AI · 青绿行星 + 土星环 */
.pl-ai .sphere { background: #37a38d; box-shadow: 0 0 38px rgba(95,203,184,0.45), 0 0 90px rgba(95,203,184,0.16); }
.pl-ai .surface {
  --spin: 34s;
  background-image:
    radial-gradient(ellipse 20% 13% at 18% 42%, rgba(198,255,238,0.5), transparent 72%),
    radial-gradient(ellipse 14% 10% at 44% 66%, rgba(14,78,64,0.5), transparent 74%),
    radial-gradient(ellipse 17% 11% at 68% 30%, rgba(214,255,242,0.4), transparent 72%),
    radial-gradient(ellipse 12% 8% at 88% 58%, rgba(12,66,54,0.45), transparent 74%);
}
.ring-back, .ring-front {
  position: absolute; left: 50%; top: 50%; width: 172%; height: 44%;
  transform: translate(-50%, -50%) rotate(-18deg);
  border-radius: 50%; border: 4px solid rgba(150,235,215,0.5);
  box-shadow: 0 0 14px rgba(150,235,215,0.22);
  pointer-events: none;
}
.ring-back { z-index: 0; border-color: rgba(150,235,215,0.34); }
.ring-front { z-index: 4; clip-path: inset(50% 0 0 0); }

/* PPT · 紫罗兰陨坑行星 + 绕行卫星（锁定态） */
.pl-ppt .sphere { background: #7458cf; box-shadow: 0 0 38px rgba(167,143,240,0.45), 0 0 90px rgba(167,143,240,0.16); }
.pl-ppt .surface {
  --spin: 42s;
  background-image:
    radial-gradient(ellipse 7% 7% at 16% 34%, rgba(52,30,120,0.55), transparent 75%),
    radial-gradient(ellipse 5% 5% at 38% 60%, rgba(238,230,255,0.42), transparent 75%),
    radial-gradient(ellipse 6% 6% at 62% 28%, rgba(52,30,120,0.5), transparent 75%),
    radial-gradient(ellipse 4% 4% at 80% 64%, rgba(238,230,255,0.36), transparent 75%),
    radial-gradient(ellipse 8% 8% at 94% 42%, rgba(52,30,120,0.42), transparent 75%),
    radial-gradient(ellipse 5% 5% at 30% 82%, rgba(52,30,120,0.4), transparent 75%);
}
.moon-orbit { position: absolute; inset: -24px; border-radius: 50%; z-index: 3; animation: moonOrbit 15s linear infinite; pointer-events: none; }
.moon-orbit .moon {
  position: absolute; top: 0; left: 50%; width: 17px; height: 17px; margin-left: -8.5px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffffff, #d9cff5 55%, #9a86d6);
  box-shadow: 0 0 12px rgba(226,216,255,0.75);
}
@keyframes moonOrbit {
  from { transform: rotate(14deg) rotate(0turn); opacity: 0.55; }
  50%  { opacity: 1; }
  to   { transform: rotate(14deg) rotate(1turn); opacity: 0.55; }
}

/* 英语 · 蓝色海洋行星 + 云纹 + 闪星 */
.pl-eng .sphere { background: #4679d2; box-shadow: 0 0 38px rgba(127,174,240,0.48), 0 0 90px rgba(127,174,240,0.17); }
.pl-eng .surface {
  --spin: 30s;
  background-image:
    radial-gradient(ellipse 24% 12% at 18% 40%, rgba(255,255,255,0.5), transparent 72%),
    radial-gradient(ellipse 18% 10% at 48% 68%, rgba(18,58,138,0.46), transparent 74%),
    radial-gradient(ellipse 20% 9% at 74% 30%, rgba(255,255,255,0.44), transparent 72%),
    radial-gradient(ellipse 14% 8% at 92% 62%, rgba(16,52,126,0.42), transparent 74%),
    radial-gradient(ellipse 16% 8% at 34% 20%, rgba(255,255,255,0.3), transparent 74%);
}
.pl-eng .tw { position: absolute; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.9); animation: twinkle 2.4s ease-in-out infinite; z-index: 3; }
.pl-eng .tw.t1 { top: -2px; right: 8px; font-size: 0.9rem; }
.pl-eng .tw.t2 { bottom: 4px; left: 2px; font-size: 0.7rem; animation-delay: 1.2s; }

/* ===== 热爱的运动 · 天体轨道（星空元素） ===== */
.sports-feature { display: flex; justify-content: center; margin: 10px 0 20px; }
.yoga-orbit {
  width: min(720px, 100%);
  display: flex; align-items: center; gap: 30px;
  background:
    radial-gradient(120% 140% at 18% 20%, rgba(143,208,168,0.16), transparent 55%),
    radial-gradient(120% 140% at 85% 90%, rgba(217,184,122,0.14), transparent 55%),
    linear-gradient(150deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: var(--radius);
  padding: 26px 30px;
  box-shadow: var(--shadow); backdrop-filter: blur(10px);
  position: relative; overflow: hidden;
}
.yoga-orbit::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 28%, rgba(255,255,255,0.9), transparent 60%),
    radial-gradient(1.2px 1.2px at 78% 22%, rgba(255,255,255,0.7), transparent 60%),
    radial-gradient(1.6px 1.6px at 64% 72%, rgba(255,236,194,0.85), transparent 60%),
    radial-gradient(1.2px 1.2px at 30% 82%, rgba(255,255,255,0.6), transparent 60%);
  opacity: 0.8;
}
.yoga-medallion { flex: 0 0 auto; width: 188px; height: 188px; position: relative; }
.yoga-nebula {
  position: absolute; inset: -18%; border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, rgba(143,208,168,0.30), rgba(217,184,122,0.10) 45%, transparent 70%);
  filter: blur(6px);
}
.yoga-ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.yoga-ring .ring-dash { animation: spin 22s linear infinite; transform-origin: 100px 100px; }
.yoga-ring .orbit-dots { transform-origin: 100px 100px; animation: spin 16s linear infinite; }
.yoga-core {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 92px; height: 92px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, rgba(255,255,255,0.30), rgba(143,208,168,0.18) 60%, transparent 75%);
  box-shadow: 0 0 30px rgba(143,208,168,0.40), inset 0 0 18px rgba(255,255,255,0.25);
  animation: corePulse 4.5s ease-in-out infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes corePulse {
  0%,100% { box-shadow: 0 0 26px rgba(143,208,168,0.34), inset 0 0 16px rgba(255,255,255,0.22); }
  50%     { box-shadow: 0 0 40px rgba(143,208,168,0.55), inset 0 0 22px rgba(255,255,255,0.34); }
}
.yoga-label { position: relative; z-index: 1; text-align: left; }
.yoga-label h3 { font-size: 1.3rem; color: #eafff2; margin-bottom: 8px; font-weight: 600; letter-spacing: 0.5px; }
.yoga-label p { font-size: 0.9rem; color: var(--text-soft); line-height: 1.55; }

/* ===== 致谢 / 展望 · 星座卡片（星空元素） ===== */
.cosmic-card {
  position: relative; max-width: 720px; margin: 0 auto;
  padding: 30px 34px; text-align: center;
  background:
    radial-gradient(120% 150% at 50% -10%, rgba(143,208,168,0.12), transparent 55%),
    linear-gradient(150deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: var(--radius);
  box-shadow: var(--shadow); backdrop-filter: blur(10px);
  overflow: hidden;
}
.cosmic-card::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    radial-gradient(1.3px 1.3px at 16% 30%, rgba(255,255,255,0.85), transparent 60%),
    radial-gradient(1.2px 1.2px at 84% 24%, rgba(255,236,194,0.8), transparent 60%),
    radial-gradient(1.5px 1.5px at 72% 78%, rgba(255,255,255,0.7), transparent 60%),

@keyframes twk { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
.shooting-star {

.heart-stars { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.heart-stars .hs {

}
@keyframes starBlink {

  50%      { opacity: 0.15; transform: translate(-50%, -50%) scale(0.55); }

/* ===== 展望 · 螺旋星系圈住整句话 ===== */
.outlook-wrap {

}
.galaxy-svg .gstar { fill: #ffffff; opacity: 0; transition: opacity 0.6s ease; }
.outlook-wrap.is-visible .gstar { opacity: 1; animation: gtwinkle 3.6s ease-in-out infinite; animation-delay: calc(var(--d, 0) * 1.4s + 1.6s); }
@keyframes gtwinkle { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }
.outlook-text {

/* ===== 联系方式 · 卡通火箭（号码写在火箭上） ===== */
.rocket {

}

.rocket:hover .flame { animation: ignite 0.3s ease-in-out infinite alternate; }
@keyframes ignite { from { transform: scaleX(1); opacity: 0.8; } to { transform: scaleX(1.5); opacity: 1; } }
.rocket-svg {

}
.rocket .copy-btn {

}

footer { text-align: center; margin-top: 40px; padding: 25px 0 5px; color: var(--text-soft); border-top: 1px solid var(--border); font-size: 0.8rem; }
.watermark-wechat { position: fixed; bottom: 10px; right: 20px; font-size: 0.7rem; color: var(--text-soft); opacity: 0.45; pointer-events: none; letter-spacing: 1px; z-index: 40; }
#backToTop { position: fixed; bottom: 28px; right: 20px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #07120b; border: none; border-radius: 50px; padding: 14px 16px; font-size: 1.1rem; cursor: pointer; box-shadow: var(--shadow-hover); transition: all var(--transition); z-index: 50; display: none; min-width: 48px; min-height: 48px; }
#backToTop.show { display: block; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

/* ---------- 着陆场景（点击星球后） ---------- */
.overlay-page { position: fixed; inset: 0; z-index: 100; background: #05080a; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
.overlay-page.active { opacity: 1; pointer-events: auto; }
.landing { position: relative; width: 100%; height: 100%; overflow: hidden; }
.landing-sky { position: absolute; inset: 0; background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 78%, var(--ground-1) 100%); }
.landing-sky .sky-star { position: absolute; color: #fff; animation: twinkle 2.8s ease-in-out infinite; }
.buddy-planet {
  position: absolute; top: 13%; right: 12%; width: 58px; height: 58px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffffff 0%, var(--buddy) 55%, rgba(0,0,0,0.35) 100%);
  box-shadow: 0 0 34px color-mix(in srgb, var(--buddy) 65%, transparent), 0 0 90px color-mix(in srgb, var(--buddy) 30%, transparent);
  animation: buddyFloat 7s ease-in-out infinite;
}
@keyframes buddyFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
.landing-ground {
  position: absolute; left: 50%; bottom: -6vh; width: 170vw; height: 46vh;
  transform: translateX(-50%);
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  background: linear-gradient(180deg, var(--ground-1), var(--ground-2));
  box-shadow: inset 0 14px 40px rgba(255,255,255,0.10), inset 0 -30px 70px rgba(0,0,0,0.45);
}
.landing-head { position: absolute; top: 8vh; left: 0; right: 0; text-align: center; z-index: 3; padding: 0 16px; }
.landing-kicker { font-size: 0.78rem; letter-spacing: 4px; color: rgba(255,255,255,0.72); text-transform: uppercase; animation: fadeUp 0.6s ease both; }
.landing-title { font-size: 2.1rem; font-weight: 700; color: #fff; text-shadow: 0 2px 20px rgba(0,0,0,0.55); margin-top: 6px; animation: fadeUp 0.6s 0.08s ease both; }

/* 星球表面的物件（照片=房屋，树木=点缀） */
.landing-props {
  position: absolute; left: 50%; bottom: 15vh; transform: translateX(-50%);
  display: flex; align-items: flex-end; justify-content: center;
  gap: clamp(12px, 3vw, 30px); flex-wrap: nowrap; z-index: 2;
  max-width: 96vw;
}
.prop, .tree {
  position: relative; flex: 0 0 auto;
  opacity: 0;
  animation: propGrow 0.75s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
  animation-delay: var(--d, 0s);
  transform: rotate(var(--tilt, 0deg)) translateY(var(--lift, 0px));
}
@keyframes propGrow {
  from { opacity: 0; transform: rotate(var(--tilt, 0deg)) translateY(calc(var(--lift, 0px) + 52px)); }
  to   { opacity: 1; transform: rotate(var(--tilt, 0deg)) translateY(var(--lift, 0px)); }
}
.prop::after, .tree::after {
  content: ""; position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%);
  width: 86%; height: 15px; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0,0,0,0.42), transparent 68%);
}
.prop {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 9px 9px 8px;
  background: linear-gradient(160deg, rgba(255,255,255,0.13), rgba(255,255,255,0.04));
  border: 1px solid rgba(255,255,255,0.20);
  border-radius: 10px;
  box-shadow: 0 20px 36px rgba(0,0,0,0.5);
}
.prop img { display: block; max-height: 36vh; max-width: 24vw; width: auto; height: auto; border-radius: 6px; }
/* 心理学阅读：2×2 完整网格 + 星球上立体物件感 */
.landing-props.is-grid {
  display: grid; grid-template-columns: repeat(2, auto);
  gap: clamp(14px, 2.6vw, 26px);
  flex-wrap: initial; bottom: 15vh; max-width: 94vw;
  perspective: 1000px;
}
.landing-props.is-grid .prop {
  transform-style: preserve-3d;
  padding: 10px 10px 9px;
  background: linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
  border: 1px solid rgba(255,255,255,0.26);
  border-radius: 10px;
  box-shadow: 0 22px 42px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.25);
}
.landing-props.is-grid .prop img {
  max-height: 30vh; max-width: 40vw;
  border: 1px solid rgba(255,255,255,0.30); border-radius: 7px;
  box-shadow: 0 0 26px rgba(247,167,141,0.28);
  transform: translateZ(30px);
  animation: imgFloat 5.5s ease-in-out infinite;
  animation-delay: var(--d, 0s);
}
.landing-props.is-grid .prop::after {
  width: 68%; height: 16px; bottom: -16px;
  background: radial-gradient(ellipse, rgba(0,0,0,0.5), transparent 70%);
}
@keyframes imgFloat {
  0%,100% { transform: translateZ(30px) translateY(0); }
  50%     { transform: translateZ(30px) translateY(-9px); }
}
.prop img.hidden { display: none; }
.prop .prop-fallback { min-width: 130px; min-height: 80px; display: flex; align-items: center; justify-content: center; font-size: 0.74rem; color: rgba(255,255,255,0.65); }
.prop figcaption { font-size: 0.7rem; color: rgba(255,255,255,0.75); letter-spacing: 1.2px; }
.tree { color: var(--tree); }
.tree svg { display: block; animation: treeSway 5.5s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes treeSway { 0%,100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }

.close-overlay {
  position: absolute; top: 22px; right: 22px; z-index: 6;
  background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.28);
  color: #fff; padding: 10px 20px; border-radius: 40px; cursor: pointer;
  font-weight: 500; font-size: 0.88rem; min-height: 44px;
  backdrop-filter: blur(8px); transition: all var(--transition);
  animation: fadeUp 0.5s 0.2s ease both;
}
.close-overlay:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }

/* 各星球着陆场景配色 */
.land-psy { --sky-top: #241019; --sky-bot: #5a2f38; --ground-1: #6d3b41; --ground-2: #38202a; --buddy: #f7a78d; --tree: #7e3f47; }
.land-ai  { --sky-top: #0a2321; --sky-bot: #1c4a3e; --ground-1: #2c6b57; --ground-2: #14302b; --buddy: #8fd8c4; --tree: #2f7a5f; }
.land-eng { --sky-top: #0c1734; --sky-bot: #2a4a76; --ground-1: #3a5d92; --ground-2: #1c2f4e; --buddy: #9db9f0; --tree: #40598a; }

@media (min-width: 640px) {
  .planet-grid { grid-template-columns: repeat(4, 1fr); gap: 38px 16px; }

  .nav-links { order: 2; width: auto; }
}

  .galaxy-hero { height: 360px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  .meteor-chars .ch { animation: none !important; opacity: 1 !important; }

}
@media print {
  nav, #backToTop, .hero-buttons .btn, .icon-btn, .copy-btn, #starfield, .name-glow, .spark, .ring-front, .ring-back, .sat-orbit, .moon-orbit, .pl-eng .tw { display: none !important; }

}

      <text x="145" y="45" text-anchor="middle" font-size="7" fill="#8395a7" font-family="inherit" letter-spacing="1">${label}</text>

  const contactDiv = document.getElementById('contactInfo');

     <div class="rocket">${rocketSVG(2, '💬 微信', resume.wechat)}</div>
     <div class="rocket">${rocketSVG(3, '✉️ 邮箱', emailFull)}<button class="copy-btn" data-copy="${emailFull}">复制</button></div>`;
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async () => {

  // ===== 展望 · 螺旋星系（滚动入场动态形成） =====
  const galaxySvg = document.getElementById('galaxySvg');
  if (galaxySvg) {
    const ns = 'http://www.w3.org/2000/svg';
    const CX = 320, CY = 260, MAX_R = 280, PERSP = 0.42;
    const arms = 2;
    const frag = document.createDocumentFragment();

    // 螺旋臂上的星点
    for (let i = 0; i < 260; i++) {
      const arm = i % arms;
      const t = (i / 260) * 4.5 + 0.1;
      const r = Math.pow(t / 4.5, 1.4) * MAX_R;
      const a = t * Math.PI + (arm ? Math.PI : 0) + (Math.random() - 0.5) * 0.5;
      const spread = (Math.random() - 0.5) * 22;
      const x = CX + (r + spread) * Math.cos(a);
      const y = CY + (r + spread) * Math.sin(a) * PERSP;
      if (x < -10 || x > 650 || y < -10 || y > 530) continue;
      const size = 0.5 + Math.random() * 2.0 + (r < 70 ? 0.3 : 0);
      const dist = Math.min(1, r / MAX_R);
      const c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', size);
      c.setAttribute('class', 'gstar');
      c.style.setProperty('--d', dist);
      c.style.transitionDelay = (dist * 1.4) + 's';
      frag.appendChild(c);
    }
    // 核心亮星团
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * 34;
      const x = CX + r * Math.cos(a);
      const y = CY + r * Math.sin(a) * PERSP;
      const size = 0.4 + Math.random() * 1.3;
      const dist = r / 34;
      const c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', size);
      c.setAttribute('class', 'gstar');
      c.style.setProperty('--d', dist * 0.35);
      c.style.transitionDelay = (dist * 0.45) + 's';
      frag.appendChild(c);
    }
    // 背景散星
    for (let i = 0; i < 70; i++) {
      const x = Math.random() * 640;
      const y = Math.random() * 520;
      const size = 0.3 + Math.random() * 1;
      const c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', size);
      c.setAttribute('class', 'gstar');
      c.style.setProperty('--d', 1);
      c.style.transitionDelay = (1.7 + Math.random() * 0.6) + 's';
      frag.appendChild(c);
    }
    galaxySvg.appendChild(frag);

  // 滚动入场：进入视野时，星系点亮

        if (e.isIntersecting) {

  // ---------- 星空闪烁背景 ----------
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stars = [], W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

  function isLight() { return root.getAttribute('data-theme') === 'light'; }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initStars();
  }
  function initStars() {
    const count = Math.floor((W * H) / 5200);
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        baseA: Math.random() * 0.5 + 0.25,
        tw: Math.random() * 0.018 + 0.004,
        phase: Math.random() * Math.PI * 2,
        vy: Math.random() * 0.12 + 0.015,
        warm: Math.random() < 0.32
      });
    }
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    const light = isLight();
    const alphaScale = light ? 0.5 : 1;
    for (const s of stars) {
      s.phase += s.tw;
      s.y += s.vy;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
      let a = s.baseA + Math.sin(s.phase) * 0.4;
      a = Math.max(0, Math.min(1, a)) * alphaScale;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      if (s.warm) ctx.fillStyle = `rgba(255, 222, 170, ${a})`;
      else ctx.fillStyle = `rgba(205, 240, 220, ${a})`;
      ctx.shadowBlur = s.r * 3.2;
      ctx.shadowColor = s.warm ? 'rgba(255,205,140,0.8)' : 'rgba(170,230,200,0.7)';
      ctx.fill();
    }
    if (!reduceMotion) requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  if (reduceMotion) draw(); else requestAnimationFrame(draw);

  function skyStars() {
    let html = '';

      const top = Math.round(Math.random() * 44);
      const left = Math.round(Math.random() * 94);
      const size = (Math.random() < 0.5 ? '✦' : '✧');
      const fs = (Math.random() * 0.5 + 0.55).toFixed(2);
      const delay = (Math.random() * 2.6).toFixed(2);
      html += `<span class="sky-star" style="top:${top}%; left:${left}%; font-size:${fs}rem; animation-delay:${delay}s">${size}</span>`;
    }
    return html;
  }

  function buildProps(scene) {
    // 物件与树木混排：照片居中为"房屋"，树木在两侧作"树林"，沿地面弧线错落
    const items = [];
    const mid = scene.props;
    const leftTrees = scene.trees.filter(t => t.pos === 'left');
    const rightTrees = scene.trees.filter(t => t.pos === 'right');
    const seq = [...leftTrees.map(t => ({ tree: t })), ...mid.map(p => ({ prop: p })), ...rightTrees.map(t => ({ tree: t }))];
    const n = seq.length;
    const isGrid = !!scene.grid;
    return seq.map((it, i) => {
      const t = n > 1 ? (i - (n - 1) / 2) / ((n - 1) / 2) : 0;   // -1 ~ 1
      const tilt = isGrid ? 0 : (t * 9).toFixed(1);               // 网格模式端正铺排
      const lift = isGrid ? 0 : Math.round(Math.abs(t) * 30 + (it.tree ? 6 : 0)); // 两侧沿弧线抬升
      const d = (0.18 + i * 0.14).toFixed(2);
      if (it.tree) {
        const svg = it.tree.kind === 'pine' ? TREE_PINE(it.tree.h) : TREE_ROUND(it.tree.h);
        return `<span class="tree" style="--tilt:${tilt}deg; --lift:${lift}px; --d:${d}s">${svg}</span>`;
      }
      const p = it.prop;
      return `<figure class="prop" style="--tilt:${tilt}deg; --lift:${lift}px; --d:${d}s">
        <img src="${p.src}" alt="${p.cap}" onerror="this.outerHTML='<span class=&quot;prop-fallback&quot;>${p.cap} · 待添加</span>'">
        <figcaption>${p.cap}</figcaption>
      </figure>`;
    }).join('');
  }

  function openLanding(identity) {
    const scene = SCENES[identity.special];

    overlayPage.classList.add('active');
    document.body.style.overflow = 'hidden';
    landingScene.querySelector('#closeOverlay').addEventListener('click', closeLanding);
  }
  function closeLanding() {
    overlayPage.classList.remove('active');
    document.body.style.overflow = '';
    setTimeout(() => { if (!overlayPage.classList.contains('active')) landingScene.innerHTML = ''; }, 400);
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlayPage.classList.contains('active')) closeLanding();
  });

  cardsContainer.addEventListener('click', (e) => {
    const card = e.target.closest('.planet-item');
    if (!card) return;
    e.preventDefault();
    if (card.dataset.locked) return;            // PPT 星球不可着陆
    openLanding(resume.identities[parseInt(card.dataset.index)]);
  });

  // 减少动态偏好：暂停星系 SMIL 巡星动画
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('svg').forEach(s => { if (s.pauseAnimations) s.pauseAnimations(); });
  }
})();
</script>
</body>
</html>
